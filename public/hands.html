<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helping Hands</title>
    <script type="module" crossorigin src="/assets/index-hands.js?v=genesis"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DUEE_oYC.css">
    <style>
      body, html, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('wheel', (e) => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'CELESTIAL_SCROLL', deltaY: e.deltaY }, '*');
        }
      }, { passive: true });
    </script>
  </body>
</html>
